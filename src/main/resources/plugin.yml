name: BNOF-Races
version: '${version}'
main: dev.oneframe.races.BnofRacesPlugin
api-version: '1.21'
author: OneFrame
description: Pluggable player-race system for the BNOF server.

commands:
  race:
    description: Manage player races.
    usage: /race <list|info|get|set|clear|reload>
    permission: bnof.race.self

permissions:
  bnof.race.self:
    default: true
    description: Allows viewing race info and your own race.
  bnof.race.admin:
    default: op
    description: Allows assigning/clearing races and reloading the registry.
  oneframe.race.self:
    default: true
    description: Legacy alias retained for existing permission setups.
  oneframe.race.admin:
    default: op
    description: Legacy alias retained for existing permission setups.
